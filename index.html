<script>
// =====================================================
// Adaptateur navigateur : simule les fonctions de
// Scriptable pour faire tourner le même script sur
// Mac / PC (Chrome, Safari, Edge, Firefox).
// =====================================================
(function () {
  const noop = function () {};
  const Stub = class { constructor() { return new Proxy(this, { get: (t, k) => (k in t ? t[k] : noop), set: () => true }); } };
  window.Color = class { constructor(h, a) { this.hex = String(h).replace("#", ""); this.alpha = a ?? 1; } static white() { return new Color("#FFFFFF"); } };
  window.Font = new Proxy({}, { get: () => () => ({}) });
  for (const n of ["Size", "Rect", "Point", "Path", "DrawContext", "LinearGradient", "ListWidget"]) window[n] = Stub;
  window.URLScheme = { forRunningScript: () => location.href };
  window.config = { runsInWidget: false, runsInAccessoryWidget: false, widgetFamily: null };
  window.Script = { setWidget: noop, complete: noop };

  // Cache : localStorage du navigateur
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) {
      try { localStorage.setItem(k, v); }
      catch (e) { // plein -> on vide l'ancien cache météo/pilotes puis on réessaie
        try { Object.keys(localStorage).filter(x => x.startsWith("mgp/")).forEach(x => localStorage.removeItem(x)); localStorage.setItem(k, v); } catch (e2) {}
      }
    }
  };
  window.FileManager = { local: () => ({
    joinPath: (...a) => a.join("/"),
    documentsDirectory: () => "mgp",
    fileExists: p => !p.endsWith(".json") || LS.get(p) !== null,
    createDirectory: noop,
    readString: p => LS.get(p),
    writeString: (p, s) => LS.set(p, s)
  }) };

  // Réseau
  // L'API MotoGP n'accepte que les requêtes venant de motogp.com :
  // depuis un fichier (ou un autre site), le navigateur la bloque.
  // On passe donc par un relais public (r.jina.ai en priorité,
  // testé OK), limité à ~20 requêtes/minute -> régulateur intégré.
  const jinaParse = txt => {
    const w = /Warning: Target URL returned error (\d+)/.exec(txt);
    if (w) throw new Error("l'API a refusé le relais (HTTP " + w[1] + ")");
    const i = txt.indexOf("Markdown Content:");
    const j = JSON.parse((i >= 0 ? txt.slice(i + 17) : txt).trim());
    if (j && !Array.isArray(j) && (j.error || j.code) && Object.keys(j).length <= 4) throw new Error("réponse d'erreur du relais : " + JSON.stringify(j).slice(0, 80));
    return j;
  };
  const ROUTES = [
    { name: "Relais r.jina.ai", url: u => "https://r.jina.ai/" + u, text: jinaParse, limited: true },
    { name: "Accès direct", url: u => u },
    { name: "Relais codetabs", url: u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u) },
    { name: "Relais allorigins", url: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) }
  ];
  let best = Number(LS.get("mgp_route2") || 0) || 0;
  if (!ROUTES[best]) best = 0;
  const diag = {};
  window.__isWeb = true;
  window.__netDiag = () => ROUTES.map((r, i) => r.name + " : " + (diag[i] || "non essayé"));

  // Régulateur : 2 requêtes simultanées max, 18 par minute max
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const stamps = []; let active = 0;
  async function slot() {
    for (;;) {
      const now = Date.now();
      while (stamps.length && now - stamps[0] > 60000) stamps.shift();
      if (active < 2 && stamps.length < 18) { active++; stamps.push(now); return; }
      await sleep(stamps.length >= 18 ? 60000 - (now - stamps[0]) + 50 : 150);
    }
  }

  async function attempt(route, url, timeoutS) {
    for (let tries = 0; ; tries++) {
      if (route.limited) await slot();
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), timeoutS * 1000);
      try {
        const r = await fetch(route.url(url), { signal: ctl.signal, cache: "no-store" });
        if (r.status === 429 && tries < 4) { await sleep(4000 * (tries + 1)); continue; }
        if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { status: r.status });
        const json = route.text ? route.text(await r.text()) : await r.json();
        if (json == null) throw new Error("réponse vide");
        return json;
      } finally {
        clearTimeout(timer);
        if (route.limited) active--;
      }
    }
  }

  window.Request = class {
    constructor(url) { this.url = url; this.timeoutInterval = 10; this.response = null; }
    async loadJSON() {
      // Open-Meteo accepte les navigateurs : accès direct
      if (/open-meteo\.com/.test(this.url)) {
        const r = await fetch(this.url, { cache: "no-store" });
        this.response = { statusCode: r.status };
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }
      const order = [best, ...ROUTES.map((_, i) => i).filter(i => i !== best)];
      let last;
      for (const i of order) {
        try {
          const json = await attempt(ROUTES[i], this.url, 15);
          this.response = { statusCode: 200 };
          diag[i] = "OK";
          if (i !== best) { best = i; LS.set("mgp_route2", String(i)); }
          return json;
        } catch (e) {
          diag[i] = e.name === "AbortError" ? "délai dépassé" : e instanceof TypeError ? "bloqué par le navigateur" : String(e.message || e);
          last = e;
          if (e.status === 404) break; // la donnée n'existe pas
        }
      }
      throw last || new Error("réseau indisponible");
    }
  };

  // Affichage : la page du dashboard remplace l'écran de chargement
  window.WebView = class {
    async loadHTML(html) {
      document.open(); document.write(html); document.close();
      await new Promise(r => setTimeout(r, 0));
    }
    present() { return new Promise(noop); }
    async evaluateJavaScript(js) { return (0, eval)(js); }
  };

  window.addEventListener("error", e => {
    const m = document.getElementById("bootMsg");
    if (m) m.textContent = "Erreur : " + e.message;
  });
})();
</script>
<script type="module">
// ===== Script MotoGP Pro (identique à la version Scriptable) =====
// ==================================================
// MOTOGP PRO RACING V9.2
// Widget iPhone (toutes tailles + écran verrouillé)
// + Dashboard plein écran
// Fuseau horaire : Europe/Paris
// ==================================================
//
// NOUVEAUTÉS V9
// • Circuit reconnu par son nom (ex. GP d'Australie à Adelaide
//   ou Phillip Island) + circuits d'Adelaide et d'Argentine
// • Intersaison : les pilotes de la saison précédente restent
//   affichés jusqu'à la première course
// • Mise en page adaptée aux grands écrans (iPad / ordinateur)
//
// V8
// • Onglet PILOTES : fiche complète de chaque pilote MotoGP
//   (titres, victoires, podiums, poles, records, carrière…)
// • Onglet CIRCUITS : fiche technique + records de chaque circuit
// • Onglet MÉTÉO : prévisions 16 jours sur chaque circuit
//   + météo heure par heure des séances (Open-Meteo, gratuit)
// • Météo de la course dans le grand widget
// • Dashboard instantané : les fiches pilotes se chargent
//   en arrière-plan puis restent en cache
//
// V7
// • Prochain GP 100 % automatique (plus besoin de date manuelle)
// • Correction des horaires décalés renvoyés par l'API
//   (GP reportés : ex. Portugal déplacé au 20-22 nov. 2026)
// • Tests hivernaux exclus du calendrier
// • Bascule automatique sur la saison suivante
// • Widgets petit / moyen / grand / écran verrouillé
// • Minuteur en direct pendant le week-end de course
// • Chargements en parallèle + cache hors-ligne
// ==================================================

const CFG = {
  api: "https://api.motogp.pulselive.com/motogp/v1",
  weatherApi: "https://api.open-meteo.com/v1/forecast",
  tz: "Europe/Paris",
  locale: "fr-FR",

  // Rafraîchissement du widget (minutes)
  refreshMinutes: 30,
  refreshMinutesWeekend: 10,

  // Cible du décompte J-X :
  //  "weekend" -> jusqu'au vendredi (début du GP)
  //  "race"    -> jusqu'au dimanche (course principale)
  countdownTo: "weekend",

  // Forçage manuel FACULTATIF (laisser null = automatique)
  // ex : { date: "2026-11-20", name: "GP Portugal" }
  manualGP: null,

  // Aperçu dans l'app au lieu du dashboard :
  // null, "small", "medium", "large"
  preview: null
};

const YEAR = new Date().getFullYear();
const DAY = 86400000;

const C = {
  bg1: new Color("#0B0D13"),
  bg2: new Color("#171C27"),
  card: new Color("#1D2230"),
  red: new Color("#FF2D46"),
  white: Color.white(),
  gray: new Color("#8E94A3"),
  green: new Color("#34D399"),
  gold: new Color("#FFD166"),
  track: new Color("#2A303C")
};

// ==================================================
// CACHE
// ==================================================

const fm = FileManager.local();
const cacheDir = fm.joinPath(fm.documentsDirectory(), "MotoGPProV9Cache");
if (!fm.fileExists(cacheDir)) fm.createDirectory(cacheDir, true);

let STALE = false; // true si une donnée vient du cache après une erreur réseau

const cachePath = key => fm.joinPath(cacheDir, key.replace(/[^\w-]/g, "_") + ".json");

function getCache(key) {
  try {
    const p = cachePath(key);
    return fm.fileExists(p) ? JSON.parse(fm.readString(p)) : null;
  } catch (e) { return null; }
}

function setCache(key, data) {
  try {
    fm.writeString(cachePath(key), JSON.stringify({ time: Date.now(), data }));
  } catch (e) { console.log("Cache : " + e); }
}

// ==================================================
// API
// ==================================================

const api = (path, key, minutes = 60, timeout = 10) =>
  fetchJSON(CFG.api + path, key, minutes, timeout);

async function fetchJSON(url, key, minutes = 60, timeout = 10) {
  const cached = getCache(key);
  if (cached && Date.now() - cached.time < minutes * 60000) return cached.data;

  try {
    const req = new Request(url);
    req.timeoutInterval = timeout;
    const json = await req.loadJSON();
    const code = req.response?.statusCode;
    if (code >= 400) throw new Error("HTTP " + code);
    if (json == null) throw new Error("Réponse vide");
    setCache(key, json);
    return json;
  } catch (e) {
    console.log(key + " : " + e);
    if (cached) { STALE = true; return cached.data; }
    return null;
  }
}

function asArray(v) {
  if (Array.isArray(v)) return v;
  if (!v || typeof v !== "object") return [];
  for (const k of ["data", "results", "items", "classification", "standings", "riders", "events", "sessions"]) {
    if (Array.isArray(v[k])) return v[k];
  }
  return [];
}

const getID = x => x?.id || x?.uuid || x?.event_uuid || null;
const own = (o, k) => o && Object.prototype.hasOwnProperty.call(o, k);

// ==================================================
// DATES (calendrier de Paris)
// ==================================================

// Analyse robuste : "2026-11-20", "2026-11-20 13:00:00",
// "2026-11-20T13:00:00+0000"... (Safari refuse certains formats)
function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  let s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) s += "T00:00:00Z";
  else {
    s = s.replace(" ", "T").replace(/([+-]\d{2})(\d{2})$/, "$1:$2");
    if (!/(Z|[+-]\d{2}:\d{2})$/.test(s)) s += "Z";
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function parts(date, opts) {
  const out = {};
  for (const p of new Intl.DateTimeFormat("en-CA", { timeZone: CFG.tz, ...opts }).formatToParts(date)) {
    if (p.type !== "literal") out[p.type] = p.value;
  }
  return out;
}

// Date -> "AAAA-MM-JJ" à l'heure de Paris
function keyOf(date = new Date()) {
  const p = parts(date, { year: "numeric", month: "2-digit", day: "2-digit" });
  return `${p.year}-${p.month}-${p.day}`;
}

// "AAAA-MM-JJ" -> numéro de jour (insensible au changement d'heure)
function dayNum(key) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(key || ""));
  return m ? Math.round(Date.UTC(+m[1], m[2] - 1, +m[3]) / DAY) : null;
}

const numToKey = n => new Date(n * DAY).toISOString().slice(0, 10);
const addDays = (key, n) => numToKey(dayNum(key) + n);
const todayNum = () => dayNum(keyOf());
const daysTo = key => (dayNum(key) == null ? null : dayNum(key) - todayNum());
const keyToDate = key => new Date(key + "T12:00:00Z");

// Valeur API -> clé jour. Une date sans heure est prise telle quelle.
function dayKey(v) {
  if (!v) return null;
  const s = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = parseDate(s);
  return d ? keyOf(d) : null;
}

// Décalage horaire de Paris en minutes (UTC+60 / +120)
function tzOffset(date) {
  const p = parts(date, {
    hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
  const asUTC = Date.UTC(+p.year, p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return Math.round((asUTC - date.getTime()) / 60000);
}

function fmt(date, opts) {
  return date ? new Intl.DateTimeFormat(CFG.locale, { timeZone: CFG.tz, ...opts }).format(date) : "—";
}

const fmtHour = d => fmt(d, { hour: "2-digit", minute: "2-digit" });
const fmtDay = d => fmt(d, { weekday: "short", day: "numeric", month: "short" });
const fmtLong = d => fmt(d, { weekday: "long", day: "numeric", month: "long" });

// "20 – 22 nov." / "30 oct. – 1 nov."
function fmtRange(startKey, endKey) {
  if (!startKey) return "Date indisponible";
  const s = keyToDate(startKey), e = keyToDate(endKey || startKey);
  const sameMonth = startKey.slice(0, 7) === (endKey || startKey).slice(0, 7);
  const a = sameMonth ? fmt(s, { day: "numeric" }) : fmt(s, { day: "numeric", month: "short" });
  return a + " – " + fmt(e, { day: "numeric", month: "short" });
}

const plural = (n, word) => n + " " + word + (Math.abs(n) > 1 ? "s" : "");

// ==================================================
// GRANDS PRIX
// ==================================================

const GP_FR = {
  THA: "Thaïlande", BRA: "Brésil", USA: "États-Unis", AME: "Amériques",
  ARG: "Argentine", QAT: "Qatar", SPA: "Espagne", FRA: "France",
  CAT: "Catalogne", ITA: "Italie", HUN: "Hongrie", CZE: "Tchéquie",
  NED: "Pays-Bas", GER: "Allemagne", GBR: "Grande-Bretagne", ARA: "Aragon",
  RSM: "Saint-Marin", AUT: "Autriche", JPN: "Japon", INA: "Indonésie",
  AUS: "Australie", MAL: "Malaisie", POR: "Portugal", VAL: "Valence",
  IND: "Inde", KAZ: "Kazakhstan", EMI: "Émilie-Romagne"
};

function titleCase(s) {
  return s.toLowerCase().replace(/(^|[\s-])\S/g, c => c.toUpperCase());
}

function flag(iso) {
  const s = String(iso || "").toUpperCase();
  if (!/^[A-Z]{2}$/.test(s)) return "🏁";
  return String.fromCodePoint(...[...s].map(c => 0x1f1e6 + c.charCodeAt(0) - 65));
}

function normEvent(e) {
  const startKey = dayKey(e.date_start || e.start_date || e.date);
  const endKey = dayKey(e.date_end || e.end_date) || (startKey && addDays(startKey, 2));
  const raw = String(e.name || e.sponsored_name || "Grand Prix").trim();
  const country = GP_FR[e.short_name] ||
    titleCase(raw.replace(/^GRAND PRIX\s+(OF\s+|DE\s+|DU\s+|D')?(THE\s+)?/i, "").trim());

  return {
    id: getID(e),
    code: e.short_name || "",
    name: "GP " + country,
    fullName: String(e.sponsored_name || raw).trim(),
    circuit: e.circuit?.name || "",
    place: e.circuit?.place || "",
    flag: flag(e.country?.iso),
    startKey,
    endKey,
    status: String(e.status || "").toUpperCase(),
    test: e.test === true || /\bTEST\b/i.test(raw)
  };
}

const isCancelled = e => e.status.includes("CANCEL");
const isFinished = e => e.status === "FINISHED" || daysTo(e.endKey) < 0;
const isUpcoming = e => !e.test && !isCancelled(e) && !isFinished(e);
const isWeekendNow = e => e && daysTo(e.startKey) <= 0 && daysTo(e.endKey) >= 0;

function cleanEvents(raw) {
  return asArray(raw)
    .map(normEvent)
    .filter(e => e.startKey && !e.test)
    .sort((a, b) => dayNum(a.startKey) - dayNum(b.startKey));
}

// Circuit d'un GP : d'abord par le nom du circuit (les GP
// peuvent changer de circuit), sinon par le code du GP.
function circuitFor(e) {
  if (!e) return null;
  const name = String(e.circuit || "") + " " + String(e.place || "");
  for (const [id, c] of Object.entries(CIRCUITS)) {
    if (c.match && c.match.test(name)) return { id, ...c };
  }
  const byCode = CIRCUITS[e.code];
  if (!byCode) return null;
  // Le code correspond mais le circuit est différent -> pas de fiche
  if (byCode.match && e.circuit && !byCode.match.test(name)) return null;
  return { id: e.code, ...byCode };
}

// Météo à l'heure d'une séance (Date) dans une réponse Open-Meteo
function weatherAt(w, date) {
  const h = w?.hourly;
  if (!h?.time || !date) return null;
  const off = (w.utc_offset_seconds || 0) * 1000;
  const target = Math.floor(date.getTime() / 3600000) * 3600000;
  const i = h.time.findIndex(t => Date.parse(t + ":00Z") - off === target);
  if (i < 0) return null;
  return {
    temp: h.temperature_2m?.[i], rain: h.precipitation_probability?.[i],
    wind: h.wind_speed_10m?.[i], code: h.weather_code?.[i]
  };
}

function sessionInfo(s) {
  const type = String(s.type || s.code || s.session_type || s.name || "").toUpperCase().trim();
  const n = s.number != null ? Number(s.number) : null;

  if (type === "RAC" || type === "RACE" || type.includes("GRAND PRIX")) return { kind: "race", label: "Course", icon: "🏁" };
  if (type === "SPR" || type.includes("SPRINT")) return { kind: "sprint", label: "Sprint", icon: "🔥" };
  if (type === "Q" || /^Q\d$/.test(type) || type.includes("QUAL")) {
    const q = n || Number(type.slice(1)) || "";
    return { kind: "qualifying", label: "Qualif" + (q ? " Q" + q : ""), icon: "⚡", n: q };
  }
  if (type === "PR") return { kind: "practice", label: "Practice", icon: "⏱️" };
  if (type === "FP" || type.includes("FP") || type.includes("PRACTICE")) {
    return { kind: "practice", label: "Essais libres" + (n ? " " + n : ""), icon: "🏍️" };
  }
  if (type === "WUP" || type.includes("WARM")) return { kind: "warmup", label: "Warm-up", icon: "🌡️" };
  return { kind: "other", label: titleCase(type || "Séance"), icon: "•" };
}

// Si l'API renvoie des horaires hors des dates du GP (GP reporté),
// on les recale sur le week-end officiel en gardant l'heure de Paris.
function normSessions(raw, ev) {
  let list = asArray(raw)
    .map(s => ({ ...sessionInfo(s), date: parseDate(s.date || s.date_start || s.start_time || s.start) }))
    .filter(s => s.date)
    .sort((a, b) => a.date - b.date);

  let shifted = false;

  if (list.length && ev?.startKey) {
    const first = dayNum(keyOf(list[0].date));
    const last = dayNum(keyOf(list[list.length - 1].date));
    const start = dayNum(ev.startKey);
    const end = dayNum(ev.endKey);

    if (first < start - 1 || last > end) {
      const off = start - first;
      list = list.map(s => {
        let t = s.date.getTime() + off * DAY;
        t += (tzOffset(s.date) - tzOffset(new Date(t))) * 60000;
        return { ...s, date: new Date(t) };
      });
      shifted = true;
    }
  }

  return { list, shifted };
}

// Séances clés : dernière qualif, sprint, course
function keySessions(list) {
  const qualifs = list.filter(s => s.kind === "qualifying");
  return [
    qualifs[qualifs.length - 1],
    list.find(s => s.kind === "sprint"),
    list.find(s => s.kind === "race")
  ].filter(Boolean);
}

function normRider(r) {
  const rider = r.rider || r;
  const name = rider.full_name || rider.name ||
    [rider.first_name || rider.given_name, rider.last_name || rider.surname].filter(Boolean).join(" ") || "Pilote";
  // Attention : tout objet JS possède .constructor -> vérifier la vraie clé
  const maker = own(r, "constructor") && typeof r.constructor === "object"
    ? r.constructor?.name : (r.constructor_name || "");

  return {
    pos: Number(r.position ?? r.pos),
    name: String(name),
    short: String(name).split(" ").slice(-1)[0],
    number: rider.number ?? "",
    team: String(r.team?.name || rider.team?.name || ""),
    maker: String(maker || ""),
    points: Number(r.points) || 0,
    flag: flag(rider.country?.iso),
    country: rider.country?.name || "",
    profileId: rider.riders_api_uuid || rider.riders_id || null,
    legacy: rider.legacy_id ?? null,
    wins: Number(r.race_wins) || 0,
    podiums: Number(r.podiums) || 0,
    sprintWins: Number(r.sprint_wins) || 0,
    sprintPodiums: Number(r.sprint_podiums) || 0,
    last: r.last_positions || {},
    sprintLast: r.sprint_last_positions || {}
  };
}

function slimProfile(p) {
  if (!p || typeof p !== "object" || !p.id) return null;
  const career = Array.isArray(p.career) ? p.career : [];
  const cur = career.find(c => c.current) || career[0] || {};

    birthDate: p.birth_date || null, birthCity: p.birth_city || "", birthCountry: p.birth_country || "",
    age: p.years_old ?? null, startYear: p.start_year ?? null,
    height: p.physical_attributes?.height ?? null, weight: p.physical_attributes?.weight ?? null,
    photo: pics.profile?.main || pics.portrait || "",
    bike: pics.bike?.main || "",
    teamColor: cur.team?.color || "",
    career: career.map(c => ({
      season: c.season, number: c.number,
      team: c.sponsored_team || c.team?.name || "",
      bike: c.team?.constructor?.name || "",
      cat: catName(c.category || c.team?.category)
    })).sort((a, b) => b.season - a.season)
  };
}

// --- Fiche pilote : statistiques de carrière (/riders/{legacy}/stats) ---

const catName = c => String(c?.name || "").replace(/™/g, "").trim();

function evLabel(e) {
  if (!e) return "";
  const gp = GP_FR[e.short_name] || titleCase(String(e.name || "").replace(/^GRAND PRIX\s+(OF\s+|DE\s+|DU\s+|D')?(THE\s+)?/i, ""));
  return (e.season ? e.season + " · " : "") + "GP " + gp + (e.circuit?.name ? " (" + e.circuit.name + ")" : "");
}

function slimStats(s) {
  if (!s || typeof s !== "object") return null;
  const block = o => ({
    total: Number(o?.total) || 0,
    by: (o?.categories || []).map(c => ({ cat: catName(c.category), n: Number(c.count) || 0 })).filter(c => c.n > 0)
  });
  const list = a => (Array.isArray(a) ? a : []).map(x => ({ cat: catName(x.category), ev: evLabel(x.event) }));
  const counts = a => (Array.isArray(a) ? a : []).map(x => ({ cat: catName(x.category), n: Number(x.count) || 0 }));
  const sum = a => counts(a).reduce((t, x) => t + x.n, 0);
  return {
    races: block(s.all_races), wins: block(s.grand_prix_victories), titles: block(s.world_championship_wins),
    podiums: block(s.podiums), seconds: block(s.second_positions), thirds: block(s.third_positions),
    poles: block(s.poles), fastLaps: block(s.race_fastest_laps),
    sprintWins: sum(s.sprint_victories), sprintSeconds: sum(s.sprint_second_positions),
    sprintThirds: sum(s.sprint_third_positions), sprintPodiums: Number(s.sprint_podiums?.total) || 0,
    firstGP: list(s.first_grand_prix), firstWin: list(s.first_grand_prix_victories),
    firstPodium: list(s.first_podiums), firstPole: list(s.first_pole_positions),
    firstFastLap: list(s.first_race_fastest_lap), lastWins: list(s.last_wins),
    best: counts(s.best_positions), bestGrid: counts(s.best_grid_positions)
  };
}

    r.legacy != null ? cachedFetch("rs_" + r.legacy, "/riders/" + r.legacy + "/stats", 720, slimStats) : null
  ]);
  return { profile: p, stats: s };

// Cache dédié aux données "allégées" (on ne garde que l'utile)
async function cachedFetch(key, path, minutes, slim) {
  const cached = getCache(key);
  if (cached && Date.now() - cached.time < minutes * 60000) return cached.data;
  try {
    const req = new Request(CFG.api + path);
    req.timeoutInterval = 12;
    const data = slim(await req.loadJSON());
    if (data) { setCache(key, data); return data; }
  } catch (e) { console.log(key + " : " + e); }
  return cached ? cached.data : null;
}

function teamColor(t) {
  const n = String(t).toLowerCase();
  if (n.includes("ducati")) return "#EF3340";
  if (n.includes("yamaha")) return "#2585FF";
  if (n.includes("honda")) return "#FF6936";
  if (n.includes("ktm")) return "#FF8900";
  if (n.includes("aprilia")) return "#A66CFF";
  return "#A5AAB8";
}

async function seasonData(seasonId) {
  const [cats, events] = await Promise.all([
    api("/results/categories?seasonUuid=" + encodeURIComponent(seasonId), "cat_" + seasonId, 1440),
    api("/results/events?seasonUuid=" + encodeURIComponent(seasonId), "events_" + seasonId, 180)
  ]);

  const cat = asArray(cats).find(c =>
    String(c.name || "").replace("™", "").trim().toLowerCase() === "motogp" || Number(c.legacy_id) === 3
  );

  return { catId: getID(cat), events: cleanEvents(events) };
}

async function getStandings(seasonId, catId) {
  if (!catId) return [];
  const data = await api(
    "/results/standings?seasonUuid=" + encodeURIComponent(seasonId) + "&categoryUuid=" + encodeURIComponent(catId),
    "standings_" + seasonId, 30
  );
  return asArray(data)
    .map(normRider)
    .filter(r => r.pos > 0)
    .sort((a, b) => a.pos - b.pos);
}

async function getSessions(ev, catId) {
  if (!ev?.id || !catId) return { list: [], shifted: false };
  const data = await api(
    "/results/sessions?eventUuid=" + encodeURIComponent(ev.id) + "&categoryUuid=" + encodeURIComponent(catId),
    "sessions_" + ev.id, 30
  );
  return normSessions(data, ev);
}

async function getLive() {
  try {
    const req = new Request(CFG.api + "/timing-gateway/livetiming-lite");
    req.timeoutInterval = 6;
    const d = await req.loadJSON();
    if (!d?.head || !d?.rider) return null;
    if (String(d.head.category || "").replace("™", "").trim() !== "MotoGP") return null;
    if (!["S", "R"].includes(String(d.head.session_status_id || ""))) return null;

    const riders = Object.values(d.rider)
      .filter(r => Number(r.pos) > 0)
      .sort((a, b) => Number(a.pos) - Number(b.pos))
      .slice(0, 12)
      .map(r => ({
        pos: Number(r.pos),
        name: r.rider_shortname || r.rider_surname || "Pilote",
        gap: Number(r.pos) === 1 ? "LEADER" : (r.gap_first ?? "—")
      }));

    return riders.length ? { session: d.head.session_name || "LIVE", riders } : null;
  } catch (e) { return null; }
}

async function loadData() {
  const out = {
    year: YEAR, events: [], next: null, round: 0, total: 0,
    sessions: [], shifted: false, ranking: [], live: null,
    weather: null, error: "", updated: new Date()
  };

  try {
    const seasons = asArray(await api("/results/seasons", "seasons", 1440));
    const cur = seasons.find(s => Number(s.year) === YEAR) || seasons.find(s => s.current);
    if (!cur) throw new Error("Saison MotoGP indisponible");

    const curId = getID(cur);
    out.year = Number(cur.year) || YEAR;

    const curData = await seasonData(curId);
    const rankingP = getStandings(curId, curData.catId);

    out.events = curData.events;
    if (!out.events.length) throw new Error("calendrier vide reçu de l'API");
    let pool = curData.events;
    let catId = curData.catId;
    let next = pool.find(isUpcoming);

    // Fin de saison -> saison suivante
    if (!next) {
      const nx = seasons.find(s => Number(s.year) === out.year + 1);
      if (nx) {
        const nxData = await seasonData(getID(nx));
        next = nxData.events.find(isUpcoming);
        if (next) { pool = nxData.events; catId = nxData.catId; out.nextSeason = out.year + 1; }
      }
    }

    // Forçage manuel facultatif
    const m = CFG.manualGP;
    if (m?.date && dayNum(m.date) != null && daysTo(m.date) >= 0) {
      const match = pool.find(e => dayNum(m.date) >= dayNum(e.startKey) && dayNum(m.date) <= dayNum(e.endKey));
      next = match || {
        id: null, name: m.name || "Prochain GP", fullName: m.name || "", circuit: "", place: "",
        flag: "🏁", startKey: m.date, endKey: addDays(m.date, 2), status: "", test: false
      };
    }

    out.next = next || null;
    if (next) {
      const races = pool.filter(e => !isCancelled(e));
      out.round = races.indexOf(next) + 1;
      out.total = races.length;
    }

    // Météo seulement si le GP est dans la fenêtre de prévision (16 j)
    const nextCircuit = circuitFor(next);
    const wantWeather = nextCircuit && daysTo(next.startKey) <= 15;

    const [ranking, sess, live, weather] = await Promise.all([
      rankingP,
      getSessions(next, catId),
      isWeekendNow(next) ? getLive() : Promise.resolve(null),
      wantWeather ? getWeather(nextCircuit) : Promise.resolve(null)
    ]);

    out.ranking = ranking;

    // Intersaison : pas encore de classement -> saison précédente
    if (!ranking.length) {
      const prev = seasons.find(s => Number(s.year) === out.year - 1);
      if (prev) {
        const prevData = await seasonData(getID(prev));
        out.ranking = await getStandings(getID(prev), prevData.catId);
        if (out.ranking.length) out.rankingYear = out.year - 1;
      }
    }
    out.sessions = sess.list;
    out.shifted = sess.shifted;
    out.live = live;
    out.weather = weather;
  } catch (e) {
    out.error = String(e.message || e);
    console.log(out.error);
  }

  return out;
}

// Pas de GP : vraie intersaison ou échec de connexion ?
const noGPLabel = D => (D.error ? "Hors connexion" : "Intersaison");

function countdownState(D) {
  const ev = D.next;
  if (!ev) return { big: "—", caption: D.error ? "Données indisponibles" : "Aucun GP à venir", days: null };

  const race = D.sessions.find(s => s.kind === "race");
  const targetKey = CFG.countdownTo === "race" && race ? keyOf(race.date) : ev.startKey;
  const days = daysTo(targetKey);
  const now = Date.now();

  // Séance en cours ou à venir (une séance "dure" ~45 min)
  const nextSession = D.sessions.find(s => s.date.getTime() + 45 * 60000 > now);
  const weekend = isWeekendNow(ev);

  if (weekend) {
    return {
      big: D.live ? "LIVE" : "GO",
      caption: nextSession ? nextSession.label + " · " + fmtHour(nextSession.date) : "Week-end de course",
      days: 0, weekend: true, nextSession, race
    };
  }

  return {
    big: "J-" + days,
    caption: days === 0 ? "C'est aujourd'hui !" : days === 1 ? "Demain !" : plural(days, "jour") + " avant le GP",
    days, weekend: false, nextSession, race
  };
}

function txt(parent, value, size = 12, color = C.white, weight = "regular") {
  const t = parent.addText(String(value));
  t.font = {
    regular: Font.systemFont(size),
    medium: Font.mediumSystemFont(size),
    semibold: Font.semiboldSystemFont(size),
    bold: Font.boldSystemFont(size),
    heavy: Font.heavySystemFont(size),
    black: Font.blackSystemFont(size)
  }[weight] || Font.systemFont(size);
  t.textColor = color;
  t.lineLimit = 1;
  t.minimumScaleFactor = 0.6;
  return t;
}

function hstack(parent, spacing = 0) {
  const s = parent.addStack();
  s.layoutHorizontally();
  s.centerAlignContent();
  s.spacing = spacing;
  return s;
}

function vstack(parent, spacing = 0) {
  const s = parent.addStack();
  s.layoutVertically();
  s.spacing = spacing;
  return s;
}

function pill(parent, label, color) {
  const p = parent.addStack();
  p.setPadding(2, 7, 2, 7);
  p.cornerRadius = 8;
  p.backgroundColor = new Color(color.hex, 0.18);
  txt(p, label, 9, color, "bold");
  return p;
}

function bar(done, total, w, h, color = C.red) {
  const dc = new DrawContext();
  dc.size = new Size(w, h);
  dc.opaque = false;
  dc.respectScreenScale = true;
  const bg = new Path();
  bg.addRoundedRect(new Rect(0, 0, w, h), h / 2, h / 2);
  dc.addPath(bg);
  dc.setFillColor(C.track);
  dc.fillPath();
  if (total > 0 && done > 0) {
    const fg = new Path();
    fg.addRoundedRect(new Rect(0, 0, Math.max(h, (w * done) / total), h), h / 2, h / 2);
    dc.addPath(fg);
    dc.setFillColor(color);
    dc.fillPath();
  }
  return dc.getImage();
}

function header(w, D, small = false) {
  const h = hstack(w);
  txt(h, small ? "🏍️ MOTOGP" : "🏍️ MOTOGP PRO", small ? 12 : 13, C.white, "heavy");
  h.addSpacer();
  if (D.live) pill(h, "● LIVE", C.green);
  else if (D.round) pill(h, "R" + D.round + "/" + D.total, C.red);
}

// Grand chiffre ou minuteur en direct
function bigCountdown(parent, st, size) {
  if (st.weekend && st.nextSession && st.nextSession.date > new Date()) {
    const d = parent.addDate(st.nextSession.date);
    d.applyTimerStyle();
    d.font = Font.heavySystemFont(size * 0.62);
    d.textColor = C.red;
    d.lineLimit = 1;
    d.minimumScaleFactor = 0.5;
    return;
  }
  txt(parent, st.big, size, C.red, "black");
}

function sessionRow(parent, s, size = 11) {
  const r = hstack(parent, 6);
  txt(r, s.icon + " " + s.label, size, C.white, "semibold");
  r.addSpacer();
  txt(r, fmtDay(s.date) + " · " + fmtHour(s.date), size, C.gray, "medium");
}

function footer(w, D) {
  const f = hstack(w);
  txt(f, D.error ? "⚠︎ " + D.error : D.shifted ? "Horaires recalés sur le report" : "Heure de Paris", 8, D.error ? C.gold : C.gray, "medium");
  f.addSpacer();
  txt(f, (STALE ? "hors-ligne · " : "MAJ ") + fmtHour(D.updated), 8, C.gray, "medium");
}

// WIDGETS
// ==================================================

function baseWidget(D) {
  const w = new ListWidget();
  const g = new LinearGradient();
  g.colors = [C.bg2, C.bg1];
  g.locations = [0, 1];
  g.startPoint = new Point(0, 0);
  g.endPoint = new Point(1, 1);
  w.backgroundGradient = g;
  w.url = URLScheme.forRunningScript();

  // Rafraîchir plus souvent le week-end, et juste après minuit (J-X)
  const weekend = isWeekendNow(D.next);
  const next = Date.now() + (weekend ? CFG.refreshMinutesWeekend : CFG.refreshMinutes) * 60000;
  const midnightUTC = (todayNum() + 1) * DAY - tzOffset(new Date()) * 60000 + 60000;
  w.refreshAfterDate = new Date(Math.min(next, midnightUTC));
  return w;
}

function smallWidget(D) {
  const w = baseWidget(D);
  const st = countdownState(D);
  w.setPadding(14, 14, 12, 14);

  header(w, D, true);
  w.addSpacer();

  txt(w, D.next ? D.next.flag + " " + D.next.name : noGPLabel(D), 14, C.white, "bold");
  txt(w, D.next ? fmtRange(D.next.startKey, D.next.endKey) : "", 10, C.gray, "medium");
  w.addSpacer(4);

  bigCountdown(w, st, 44);
  txt(w, st.weekend ? st.caption : st.race ? "Course " + fmtDay(st.race.date) + " " + fmtHour(st.race.date) : st.caption, 10, C.white, "semibold");
  return w;
}

function mediumWidget(D) {
  const w = baseWidget(D);
  const st = countdownState(D);
  w.setPadding(14, 16, 12, 16);

  header(w, D);
  w.addSpacer(8);

  const body = hstack(w, 14);
  body.topAlignContent();

  const left = vstack(body, 1);
  txt(left, D.next ? D.next.flag + " " + D.next.name : noGPLabel(D), 15, C.white, "bold");
  txt(left, D.next ? fmtRange(D.next.startKey, D.next.endKey) : "", 10, C.gray, "medium");
  left.addSpacer(4);
  bigCountdown(left, st, 42);
  txt(left, st.caption, 10, C.white, "semibold");

  const right = vstack(body, 7);
  right.setPadding(10, 10, 10, 10);
  right.cornerRadius = 14;
  right.backgroundColor = C.card;
  txt(right, "PROGRAMME", 9, C.red, "heavy");
  const ks = keySessions(D.sessions);
  if (ks.length) {
    for (const s of ks) {
      const r = vstack(right, 0);
      txt(r, s.icon + " " + s.label, 10, C.white, "semibold");
      txt(r, fmtDay(s.date) + " · " + fmtHour(s.date), 9, C.gray, "medium");
    }
  } else {
    txt(right, "Horaires à venir", 10, C.gray);
  }

  w.addSpacer();
  footer(w, D);
  return w;
}

function largeWidget(D) {
  const w = baseWidget(D);
  const st = countdownState(D);
  w.setPadding(16, 16, 12, 16);

  header(w, D);
  w.addSpacer(10);

  // Carte GP
  const card = vstack(w, 2);
  card.setPadding(12, 14, 12, 14);
  card.cornerRadius = 16;
  card.backgroundColor = C.card;

  const top = hstack(card);
  const info = vstack(top, 2);
  txt(info, "PROCHAIN GRAND PRIX", 9, C.red, "heavy");
  txt(info, D.next ? D.next.flag + " " + D.next.name : noGPLabel(D), 17, C.white, "bold");
  txt(info, D.next ? [fmtRange(D.next.startKey, D.next.endKey), D.next.place].filter(Boolean).join(" · ") : "", 10, C.gray, "medium");
  top.addSpacer();
  const cd = vstack(top, 0);
  bigCountdown(cd, st, 38);

  card.addSpacer(6);
  if (D.total) {
    const img = card.addImage(bar(Math.max(0, D.round - 1), D.total, 300, 5));
    img.imageSize = new Size(300, 5);
    img.resizable = true;
    card.addSpacer(3);
  }
  const capRow = hstack(card);
  txt(capRow, st.caption, 10, C.white, "semibold");
  capRow.addSpacer();
  const rw = st.race && weatherAt(D.weather, st.race.date);
  if (rw) {
    txt(capRow, wx(rw.code)[0] + " " + Math.round(rw.temp) + "° · 💧" + (rw.rain ?? 0) + "%", 10, C.gray, "semibold");
  }

  w.addSpacer(10);

  // Programme
  txt(w, "📅 PROGRAMME", 9, C.red, "heavy");
  w.addSpacer(5);
  const ks = keySessions(D.sessions);
  if (ks.length) {
    for (const s of ks) { sessionRow(w, s, 11); w.addSpacer(4); }
  } else {
    txt(w, "Horaires des séances à venir", 10, C.gray);
  }

  w.addSpacer(8);

  // Classement
  txt(w, D.live ? "🔴 LIVE · " + D.live.session : "🏆 CHAMPIONNAT" + (D.rankingYear ? " " + D.rankingYear : ""), 9, D.live ? C.green : C.red, "heavy");
  w.addSpacer(5);
  const rows = D.live ? D.live.riders.slice(0, 5) : D.ranking.slice(0, 5);
  if (rows.length) {
    const lead = D.ranking[0]?.points || 0;
    for (const r of rows) {
      const line = hstack(w, 6);
      txt(line, String(r.pos).padStart(2, " "), 11, r.pos === 1 ? C.gold : C.gray, "heavy");
      txt(line, (r.flag && !D.live ? r.flag + " " : "") + r.name, 11, C.white, "semibold");
      line.addSpacer();
      txt(line, D.live ? r.gap : r.pos === 1 ? r.points + " pts" : "-" + (lead - r.points), 11, C.gray, "medium");
      w.addSpacer(3);
    }
  } else {
    txt(w, "Classement indisponible", 10, C.gray);
  }

  w.addSpacer();
  footer(w, D);
  return w;
}

function accessoryWidget(D, family) {
  const w = new ListWidget();
  w.url = URLScheme.forRunningScript();
  const st = countdownState(D);
  const name = D.next ? D.next.name : "MotoGP";

  if (family === "accessoryInline") {
    txt(w, "🏍️ " + name + " · " + st.big, 12);
  } else if (family === "accessoryCircular") {
    w.addAccessoryWidgetBackground = true;
    const s = vstack(w);
    s.centerAlignContent();
    txt(s, "GP", 9, C.white, "bold").centerAlignText();
    txt(s, st.big.replace("J-", ""), 20, C.white, "black").centerAlignText();
  } else {
    txt(w, "🏍️ " + name, 13, C.white, "bold");
    txt(w, st.big, 20, C.white, "black");
    txt(w, st.caption, 11, C.white, "medium");
  }
  return w;
}

function buildWidget(D, family) {
  if (String(family).startsWith("accessory")) return accessoryWidget(D, family);
  if (family === "small") return smallWidget(D);
  if (family === "medium") return mediumWidget(D);
  return largeWidget(D);
}

// ==================================================
// DASHBOARD
// Le dashboard s'ouvre immédiatement avec les données
// en cache, puis les fiches pilotes et la météo arrivent
// en arrière-plan (sans bloquer l'affichage).
// ==================================================

const safeJSON = v => JSON.stringify(v)
  .replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");

const riderKey = r => String(r.legacy ?? r.profileId);

function dashboardPayload(D) {
  const st = countdownState(D);
  const ev = D.next;
  const race = D.sessions.find(s => s.kind === "race");
  const startT = ev ? dayNum(ev.startKey) * DAY - tzOffset(keyToDate(ev.startKey)) * 60000 : null;

  const events = D.events.map((e, i) => ({
    ...e, round: i + 1,
    state: ev && e.id === ev.id ? "next" : isCancelled(e) ? "cancel" : isFinished(e) ? "done" : "todo"
  }));

  const circuits = {};
  for (const e of events) {
    const c = circuitFor(e);
    if (c) circuits[e.code] = { ...c, gp: e.name, circuit: e.circuit, place: e.place,
      flag: e.flag, startKey: e.startKey, endKey: e.endKey, state: e.state, round: e.round };
  }
  if (ev && circuitFor(ev) && !circuits[ev.code]) {
    circuits[ev.code] = { ...circuitFor(ev), gp: ev.name, circuit: ev.circuit, place: ev.place,
      flag: ev.flag, startKey: ev.startKey, endKey: ev.endKey, state: "next", round: D.round };
  }

  const riders = {};
  for (const r of D.ranking) { const c = cachedRider(r); if (c) riders[riderKey(r)] = c; }

  return {
    year: D.year, rankingYear: D.rankingYear || D.year, nextSeason: D.nextSeason || null, round: D.round, total: D.total,
    updated: D.updated.getTime(), stale: STALE, error: D.error, shifted: D.shifted,
    next: ev, nextCode: ev?.code || null,
    sessions: D.sessions.map(s => ({ kind: s.kind, label: s.label, icon: s.icon, t: s.date.getTime() })),
    events, circuits,
    ranking: D.ranking.map(r => ({ ...r, key: riderKey(r) })),
    riders, live: D.live,
    weather: D.weather, weatherFor: D.weather ? ev?.code : null,
    wxCodes: WEATHER_CODES, weatherApi: CFG.weatherApi,
    st: { big: st.big, caption: st.caption },
    target: race ? race.date.getTime() : startT,
    raceT: race ? race.date.getTime() : null
  };
}

function clientApp() {
  const D = window.__D;
  const TZ = "Europe/Paris", LOC = "fr-FR";
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const fmt = (t, o) => (t == null ? "—" : new Intl.DateTimeFormat(LOC, { timeZone: TZ, ...o }).format(new Date(t)));
  const hour = t => fmt(t, { hour: "2-digit", minute: "2-digit" });
  const dayS = t => fmt(t, { weekday: "short", day: "numeric", month: "short" });
  const dayL = t => fmt(t, { weekday: "long", day: "numeric", month: "long" });
  const keyT = k => Date.parse(k + "T12:00:00Z");
  const fmtUTC = (k, o) => new Intl.DateTimeFormat(LOC, { timeZone: "UTC", ...o }).format(new Date(keyT(k)));
  const range = (a, b) => {
    if (!a) return "";
    b = b || a;
    const s = a.slice(0, 7) === b.slice(0, 7) ? fmtUTC(a, { day: "numeric" }) : fmtUTC(a, { day: "numeric", month: "short" });
    return s + " – " + fmtUTC(b, { day: "numeric", month: "short" });
  };
  const num = v => Number(v || 0).toLocaleString(LOC);
  const pad = x => String(x).padStart(2, "0");
  const wx = c => D.wxCodes[c] || ["🌡️", "—"];
  const teamColor = t => {
    const s = String(t).toLowerCase();
    if (s.includes("ducati")) return "#EF3340";
    if (s.includes("yamaha")) return "#2585FF";
    if (s.includes("honda")) return "#FF6936";
    if (s.includes("ktm")) return "#FF8900";
    if (s.includes("aprilia")) return "#A66CFF";
    return "#6B7280";
  };
  const plural = (n, w) => n + " " + w + (Math.abs(n) > 1 ? "s" : "");
  const pick = (block, cat) => (block?.by || []).find(c => c.cat === cat)?.n || 0;
  const catLabel = arr => (arr || []).map(c => c.cat + " " + c.n).join(" · ");

  const riders = D.riders || {};
  const weather = {};
  if (D.weather && D.weatherFor) weather[D.weatherFor] = D.weather;
  const loading = {};
  let ridersDone = false;
  let sortMode = "rank";
  let query = "";
  let openSheet = null; // { type, key }
  let wxCode = D.nextCode && D.circuits[D.nextCode]
    ? D.nextCode
    : (Object.values(D.circuits).find(c => c.state === "todo") ? Object.keys(D.circuits).find(k => D.circuits[k].state === "todo") : Object.keys(D.circuits)[0]);

  // ---------------- ACCUEIL ----------------

  function renderHome() {
    const ev = D.next;
    const byDay = {};
    for (const s of D.sessions) (byDay[fmt(s.t, { year: "numeric", month: "2-digit", day: "2-digit" })] ||= []).push(s);
    const w = D.nextCode ? weather[D.nextCode] : null;
    const programme = D.sessions.length
      ? Object.values(byDay).map(list => `
        <div class="day">${esc(dayL(list[0].t))}</div>
        ${list.map(s => {
          const m = weatherAtT(w, s.t);
          return `<div class="row ${s.kind === "race" ? "hl" : ""} ${s.t + 2700000 < Date.now() ? "past" : ""}">
            <span>${s.icon} ${esc(s.label)}</span>
            <span class="r">${m ? wx(m.code)[0] + " " + Math.round(m.temp) + "° · " : ""}<b style="color:#fff">${esc(hour(s.t))}</b></span>
          </div>`;
        }).join("")}`).join("")
      : `<p class="empty">Horaires des séances à venir</p>`;

    const top3 = D.ranking.slice(0, 3).map((r, i) => `
      <div class="row tap" data-rider="${esc(r.key)}"><span>${["🥇", "🥈", "🥉"][i]} ${r.flag} ${esc(r.name)}</span><b>${r.points} pts</b></div>`).join("");

    $("#home").innerHTML = `
      <div class="card hero">
        <div class="label">🏁 Prochain Grand Prix</div>
        <div class="gp-name">${ev ? ev.flag + " " + esc(ev.name) : D.error ? "⚠️ Données indisponibles" : "Intersaison"}</div>
        ${!ev && D.error ? `<div class="note">Impossible de joindre l'API MotoGP : ${esc(D.error)}.</div>
          ${window.__netDiag ? `<div class="foot" style="text-align:left;margin-top:10px">${window.__netDiag().map(x => "• " + esc(x)).join("<br>")}</div>` : ""}
          ${window.__isWeb ? `<button class="btn" onclick="try{Object.keys(localStorage).filter(k=>k.startsWith('mgp')).forEach(k=>localStorage.removeItem(k))}catch(e){};location.reload()">↻ Vider le cache et réessayer</button>` : ""}` : ""}
        <div class="gp-meta">${ev ? esc(range(ev.startKey, ev.endKey)) + (ev.circuit ? "<br>" + esc(ev.circuit) + (ev.place ? " · " + esc(ev.place) : "") : "") : ""}</div>
        ${ev || !D.error ? `<div class="big">${esc(D.st.big)}</div>
        <div class="caption">${esc(D.st.caption)}</div>` : ""}
        ${D.target ? `<div class="timer">
          <div><b id="t-d">–</b><small>JOURS</small></div><div><b id="t-h">–</b><small>H</small></div>
          <div><b id="t-m">–</b><small>MIN</small></div><div><b id="t-s">–</b><small>SEC</small></div></div>
          <div class="foot" style="text-align:left;margin-top:8px">${D.raceT ? "Jusqu'au départ de la course · " + esc(dayS(D.raceT)) + " " + esc(hour(D.raceT)) : "Jusqu'au début du week-end"}</div>` : ""}
        ${D.total ? `<div class="progress"><div style="width:${((D.round - 1) / D.total) * 100}%"></div></div>` : ""}
        ${ev && D.circuits[ev.code] ? `<button class="btn" data-circuit="${esc(ev.code)}">🏟️ Fiche du circuit</button>` : ""}
      </div>
      ${D.live ? `<div class="card"><div class="label" style="color:var(--green)">🔴 En direct</div>${liveHTML(5)}</div>` : ""}
      <div class="card">
        <div class="label">📅 Programme du week-end</div>
        ${programme}
        ${D.shifted ? `<div class="note">⚠︎ GP reporté : horaires recalés sur les nouvelles dates (à confirmer par MotoGP).</div>` : ""}
        ${w ? "" : D.nextCode ? `<div class="foot" style="text-align:left">La météo des séances s'affiche à J-15.</div>` : ""}
      </div>
      ${top3 ? `<div class="card"><div class="label">🏆 Championnat</div>${top3}</div>` : ""}
      <div class="foot">${D.error ? "⚠︎ " + esc(D.error) + " · " : ""}${D.stale ? "Données hors-ligne · " : ""}Mis à jour à ${esc(hour(D.updated))} · v9.2${window.__netDiag ? "<br><small>" + window.__netDiag().filter(x => !/non essayé/.test(x)).map(esc).join(" · ") + "</small>" : ""}</div>`;
  }

  // ---------------- CALENDRIER ----------------

  function renderCalendar() {
    $("#calendar").innerHTML = `<div class="card"><div class="label">📅 Calendrier ${D.year}</div>${
      D.events.length ? D.events.map(e => {
        const badge = { next: "PROCHAIN", done: "TERMINÉ", cancel: "ANNULÉ", todo: "" }[e.state];
        return `<div class="event ${e.state} ${D.circuits[e.code] ? "tap" : ""}" ${e.state === "next" ? 'id="nextEvent"' : ""} data-circuit="${esc(e.code)}">
          <div class="rnd">${e.round}</div>
          <div class="info"><b>${e.flag} ${esc(e.name)}</b><small>${esc(range(e.startKey, e.endKey))}${e.circuit ? " · " + esc(e.circuit) : ""}</small></div>
          ${badge ? `<span class="badge">${badge}</span>` : ""}
        </div>`;
      }).join("") : `<p class="empty">Calendrier indisponible</p>`}</div>`;
  }

  // ---------------- CLASSEMENT ----------------

  function renderRanking() {
    const lead = D.ranking[0]?.points || 1;
    $("#ranking").innerHTML = `<div class="card"><div class="label">🏆 Championnat pilotes ${D.rankingYear}</div>${D.rankingYear !== D.year ? `<div class="note" style="margin:-4px 0 10px">Classement ${D.rankingYear} affiché en attendant la 1re course ${D.year}.</div>` : ""}${
      D.ranking.length ? D.ranking.map((r, i) => `
        <div class="rider tap" data-rider="${esc(r.key)}">
          <div class="rider-top">
            <span class="pos">${["🥇", "🥈", "🥉"][i] || r.pos}</span>
            <div class="info"><b>${r.flag} ${esc(r.name)} <em>#${esc(r.number)}</em></b>
              <small>${esc(r.team || r.maker)}${r.wins ? " · " + plural(r.wins, "victoire") : ""}${r.podiums ? " · " + plural(r.podiums, "podium") : ""}</small></div>
            <div class="pts"><b>${r.points}</b><small>${i ? "-" + (D.ranking[0].points - r.points) : "pts"}</small></div>
          </div>
          <div class="bar"><div style="width:${Math.min(100, (r.points / lead) * 100)}%;background:${teamColor(r.team + " " + r.maker)}"></div></div>
        </div>`).join("") : `<p class="empty">Classement indisponible</p>`}</div>`;
  }

  // ---------------- PILOTES ----------------

  function riderPhoto(r) { return riders[r.key]?.profile?.photo || ""; }

  function renderRiders() {
    const loaded = D.ranking.filter(r => riders[r.key]).length;
    let list = D.ranking.slice();
    if (query) {
      const q = query.toLowerCase();
      list = list.filter(r => (r.name + " " + r.team + " " + r.maker + " " + r.number + " " + r.country).toLowerCase().includes(q));
    }
    if (sortMode === "num") list.sort((a, b) => Number(a.number) - Number(b.number));
    if (sortMode === "az") list.sort((a, b) => a.short.localeCompare(b.short, LOC));
    if (sortMode === "titles") {
      const t = r => riders[r.key]?.stats?.titles?.total || 0;
      const v = r => riders[r.key]?.stats?.wins?.total || 0;
      list.sort((a, b) => t(b) - t(a) || v(b) - v(a));
    }

    const grid = list.map(r => {
      const photo = riderPhoto(r);
      const st = riders[r.key]?.stats;
      const titles = st?.titles?.total || 0;
      return `<div class="rcard tap" data-rider="${esc(r.key)}" style="--tc:${teamColor(r.team + " " + r.maker)}">
        <div class="ph">
          ${photo ? `<img src="${esc(photo)}" loading="lazy" onerror="this.remove()">` : ""}
          <div class="num">${esc(r.number)}</div>
          ${titles ? `<span class="rp badge" style="background:rgba(0,0,0,.55);color:var(--gold)">🏆 ${titles}</span>` : ""}
        </div>
        <div class="bd"><b>${r.flag} ${esc(r.name)}</b><small>${esc(r.team || r.maker)}</small>
          <small>P${r.pos} · ${r.points} pts${r.wins ? " · " + r.wins + " vict." : ""}</small></div>
      </div>`;
    }).join("");

    $("#riders").innerHTML = `
      <div class="tools"><input class="search" id="q" placeholder="🔎 Pilote, équipe, numéro…" value="${esc(query)}" autocomplete="off"></div>
      <div class="seg">
        ${[["rank", "Classement"], ["num", "Numéro"], ["az", "A–Z"], ["titles", "Titres"]].map(([k, l]) =>
          `<button data-sort="${k}" class="${sortMode === k ? "on" : ""}">${l}</button>`).join("")}
      </div>
      ${!ridersDone && loaded < D.ranking.length ? `<div class="loadbar">⏳ Chargement des fiches… ${loaded}/${D.ranking.length}</div>` : ""}
      ${grid ? `<div class="grid">${grid}</div>` : `<p class="empty">Aucun pilote trouvé</p>`}`;

    const q = $("#q");
    q.addEventListener("input", e => {
      query = e.target.value;
      const pos = e.target.selectionStart;
      renderRiders();
      const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos);
    });
  }

  function infoRow(label, value) {
    return value == null || value === "" ? "" : `<div class="row"><span class="muted">${esc(label)}</span><b>${value}</b></div>`;
  }

  function tile(value, label, sub, cls = "") {
    return `<div class="tile"><b class="${cls}">${esc(value)}</b><small>${esc(label)}</small>${sub ? `<i>${esc(sub)}</i>` : ""}</div>`;
  }

  function evList(arr) {
    return (arr || []).length
      ? arr.map(x => `<div class="row"><span class="muted">${esc(x.cat)}</span><b style="text-align:right;font-weight:600;font-size:13px">${esc(x.ev)}</b></div>`).join("")
      : "";
  }

  function riderSheet(key) {
    const r = D.ranking.find(x => x.key === key);
    if (!r) return "";
    const data = riders[key] || {};
    const p = data.profile, s = data.stats;
    const tc = p?.teamColor || teamColor(r.team + " " + r.maker);
    const last = Object.entries(r.last || {});
    const sprintLast = Object.entries(r.sprintLast || {});
    const birth = p?.birthDate ? fmtUTC(p.birthDate, { day: "numeric", month: "long", year: "numeric" }) : "";

    let career = "";
    if (s) {
      career = `
        <div class="card">
          <div class="label">🏆 En MotoGP (catégorie reine)</div>
          <div class="tiles">
            ${tile(pick(s.titles, "MotoGP"), "Titres", "", "gold")}
            ${tile(pick(s.wins, "MotoGP"), "Victoires", "", "red")}
            ${tile(pick(s.podiums, "MotoGP"), "Podiums")}
            ${tile(pick(s.poles, "MotoGP"), "Poles")}
            ${tile(pick(s.fastLaps, "MotoGP"), "Meill. tours")}
            ${tile(pick(s.races, "MotoGP"), "Courses")}
          </div>
          ${pick(s.races, "500cc") ? `<div class="foot" style="text-align:left">En 500cc : ${pick(s.titles, "500cc")} titre(s), ${pick(s.wins, "500cc")} victoire(s), ${pick(s.races, "500cc")} courses.</div>` : ""}
        </div>
        <div class="card">
          <div class="label">⚡ Sprints MotoGP</div>
          <div class="tiles">
            ${tile(s.sprintWins, "Victoires", "", "red")}
            ${tile(s.sprintPodiums, "Podiums")}
            ${tile(s.sprintSeconds + " / " + s.sprintThirds, "2es / 3es")}
          </div>
        </div>
        <div class="card">
          <div class="label">🌍 Carrière (toutes catégories)</div>
          <div class="tiles">
            ${tile(s.titles.total, "Titres mondiaux", catLabel(s.titles.by), "gold")}
            ${tile(s.wins.total, "Victoires GP", catLabel(s.wins.by), "red")}
            ${tile(s.podiums.total, "Podiums", catLabel(s.podiums.by))}
            ${tile(s.poles.total, "Poles", catLabel(s.poles.by))}
            ${tile(s.fastLaps.total, "Meilleurs tours", catLabel(s.fastLaps.by))}
            ${tile(s.races.total, "Départs", catLabel(s.races.by))}
            ${tile(s.seconds.total, "2es places")}
            ${tile(s.thirds.total, "3es places")}
            ${tile(s.races.total ? Math.round((s.wins.total / s.races.total) * 100) + " %" : "—", "Taux victoire")}
          </div>
        </div>
        ${s.best.length ? `<div class="card"><div class="label">📈 Meilleurs résultats</div>
          ${s.best.map(b => {
            const g = s.bestGrid.find(x => x.cat === b.cat);
            return `<div class="row"><span>${esc(b.cat)}</span><span class="r">Course : <b style="color:#fff">${b.n === 1 ? "Victoire" : b.n + "e"}</b>${g ? " · Grille : <b style='color:#fff'>" + (g.n === 1 ? "Pole" : g.n + "e") + "</b>" : ""}</span></div>`;
          }).join("")}</div>` : ""}
        ${(s.firstGP.length || s.firstWin.length) ? `<div class="card"><div class="label">⭐ Premières fois</div>
          ${s.firstGP.length ? `<div class="day">Premier Grand Prix</div>${evList(s.firstGP)}` : ""}
          ${s.firstPodium.length ? `<div class="day">Premier podium</div>${evList(s.firstPodium)}` : ""}
          ${s.firstWin.length ? `<div class="day">Première victoire</div>${evList(s.firstWin)}` : ""}
          ${s.firstPole.length ? `<div class="day">Première pole</div>${evList(s.firstPole)}` : ""}
          ${s.firstFastLap.length ? `<div class="day">Premier meilleur tour</div>${evList(s.firstFastLap)}` : ""}
        </div>` : ""}
        ${s.lastWins.length ? `<div class="card"><div class="label">🏁 Dernière victoire</div>${evList(s.lastWins)}</div>` : ""}`;
    } else {
      career = `<div class="card"><p class="empty">${ridersDone ? "Statistiques de carrière indisponibles." : "⏳ Chargement des statistiques…"}</p></div>`;
    }

    const parcours = p?.career?.length ? `<div class="card"><div class="label">🗂️ Parcours</div>
      ${p.career.map(c => `<div class="row"><span><b>${c.season}</b> <span class="muted">· ${esc(c.cat)}</span></span>
        <span class="r" style="font-size:12px">${esc(c.team)}${c.bike ? " · " + esc(c.bike) : ""} · #${esc(c.number)}</span></div>`).join("")}
    </div>` : "";

    return `
      <div class="prof" style="--tc:${tc}">
        ${p?.photo ? `<img src="${esc(p.photo)}" onerror="this.remove()">` : ""}
        <div><div class="n">${esc(r.number)}</div>
          <h2>${esc(p ? p.first + " " + p.last : r.name)}</h2>
          <div class="muted" style="color:#ddd">${r.flag} ${esc(r.country)}${p?.nickname ? " · « " + esc(p.nickname) + " »" : ""}</div>
          <div style="margin-top:6px;font-weight:700;font-size:13px">${esc(r.team)}${r.maker ? " · " + esc(r.maker) : ""}</div>
        </div>
      </div>
      <div class="card">
        <div class="label">🪪 Identité</div>
        ${infoRow("Âge", p?.age != null ? p.age + " ans" : "")}
        ${infoRow("Naissance", birth ? esc(birth) + (p.birthCity ? " · " + esc(p.birthCity) : "") : "")}
        ${infoRow("Taille", p?.height ? p.height + " cm" : "")}
        ${infoRow("Poids", p?.weight ? p.weight + " kg" : "")}
        ${infoRow("Débuts en Grand Prix", p?.startYear || "")}
        ${infoRow("Moto", esc(r.maker))}
        ${!p ? `<p class="empty" style="padding:10px">${ridersDone ? "Profil indisponible" : "⏳ Chargement…"}</p>` : ""}
      </div>
      <div class="card">
        <div class="label">📊 Saison ${D.rankingYear}</div>
        <div class="tiles">
          ${tile("P" + r.pos, "Classement", "", "red")}
          ${tile(r.points, "Points")}
          ${tile(D.ranking[0] && r.pos > 1 ? "-" + (D.ranking[0].points - r.points) : "—", "Écart leader")}
          ${tile(r.wins, "Victoires")}
          ${tile(r.podiums, "Podiums")}
          ${tile(r.sprintWins + " / " + r.sprintPodiums, "Sprint V / P")}
        </div>
        ${last.length ? `<div class="day" style="margin-top:14px">Dernières courses</div><div class="chips">${last.map(([k, v]) => `<span class="chip"><em>${esc(k)}</em>${v ? (v == 1 ? "1er" : esc(v) + "e") : "Abd."}</span>`).join("")}</div>` : ""}
        ${sprintLast.length ? `<div class="day">Derniers sprints</div><div class="chips">${sprintLast.map(([k, v]) => `<span class="chip"><em>${esc(k)}</em>${v ? (v == 1 ? "1er" : esc(v) + "e") : "Abd."}</span>`).join("")}</div>` : ""}
      </div>
      ${career}
      ${parcours}
      <div class="foot">Source : API officielle MotoGP</div>`;
  }

  // ---------------- CIRCUITS ----------------

  const km = m => (m / 1000).toLocaleString(LOC, { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + " km";
  function lapSeconds(t) {
    const m = /^(\d+)'(\d+(?:\.\d+)?)$/.exec(String(t || "").replace("''", "."));
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  const avgSpeed = (len, t) => { const s = lapSeconds(t); return s ? ((len / s) * 3.6).toFixed(1).replace(".", ",") + " km/h" : ""; };

  function renderCircuits() {
    const list = Object.entries(D.circuits).sort((a, b) => a[1].round - b[1].round);
    $("#circuits").innerHTML = `<div class="card"><div class="label">🏟️ Circuits ${D.year}</div>${
      list.map(([code, c]) => `
        <div class="event tap ${c.state === "next" ? "next" : ""}" data-circuit="${esc(code)}">
          <div class="rnd">${c.flag}</div>
          <div class="info"><b>${esc(c.circuit || c.gp)}</b>
            <small>${esc(c.gp)} · ${km(c.len)} · ${c.corners} virages${c.top ? " · " + String(c.top[0]).replace(".", ",") + " km/h" : ""}</small></div>
          <span class="badge ${c.state === "next" ? "red" : ""}">${c.state === "next" ? "PROCHAIN" : c.state === "done" ? "COURU" : esc(range(c.startKey, c.endKey))}</span>
        </div>`).join("")}</div>
      <div class="foot">Records à fin 2026 · sources publiques (motogp.com, équipes, presse)</div>`;
  }

  function circuitSheet(code) {
    const c = D.circuits[code];
    if (!c) return "";
    const lapLen = c.len;
    return `
      <div class="prof" style="--tc:#3A2030;min-height:auto;display:block">
        <div class="muted" style="color:#ddd;font-weight:700">${c.flag} ${esc(c.gp)} · Manche ${c.round}</div>
        <h2 style="font-size:26px;margin-top:6px">${esc(c.circuit)}</h2>
        <div class="muted" style="color:#ddd">${esc(c.place)} · ${esc(range(c.startKey, c.endKey))} ${c.state === "done" ? "· couru" : ""}</div>
      </div>
      <div class="card">
        <div class="label">📐 Tracé</div>
        <div class="tiles">
          ${tile(km(lapLen).replace(" km", ""), "Longueur (km)", "", "red")}
          ${tile(c.corners, "Virages", c.R != null ? c.R + " droite · " + c.L + " gauche" : "")}
          ${tile(c.straight ? c.straight + " m" : "—", "Ligne droite", "la plus longue")}
          ${tile(c.opened || "—", "Ouverture")}
          ${tile(c.width ? c.width + " m" : "—", "Largeur")}
          ${tile(c.lat.toFixed(2) + "°", "Latitude", c.lon.toFixed(2) + "° long.")}
        </div>
      </div>
      <div class="card">
        <div class="label">⏱️ Records MotoGP</div>
        <div class="tiles" style="grid-template-columns:1fr 1fr">
          ${c.top ? tile(String(c.top[0]).replace(".", ",") + " km/h", "Vitesse max", c.top[1] + " (" + c.top[2] + ")", "red") : ""}
          ${c.lap ? tile(c.lap[0], "Record absolu", c.lap[1] + " (" + c.lap[2] + ")", "gold") : ""}
          ${c.race ? tile(c.race[0], "Record en course", c.race[1] + " (" + c.race[2] + ")") : ""}
          ${c.lap ? tile(avgSpeed(lapLen, c.lap[0]), "Moy. du record", "vitesse moyenne") : ""}
        </div>
        ${!c.lap && !c.top && !c.race ? `<p class="empty">Pas encore de record MotoGP sur ce tracé.</p>` : ""}
      </div>
      <button class="btn" data-weather="${esc(code)}">🌦️ Météo à 16 jours sur ce circuit</button>
      <div class="foot" style="margin-top:12px">Records à fin 2026 · sources publiques</div>`;
  }

  // ---------------- MÉTÉO ----------------

  function weatherAtT(w, t) {
    const h = w?.hourly;
    if (!h?.time || !t) return null;
    const off = (w.utc_offset_seconds || 0) * 1000;
    const target = Math.floor(t / 3600000) * 3600000;
    const i = h.time.findIndex(x => Date.parse(x + ":00Z") - off === target);
    return i < 0 ? null : { temp: h.temperature_2m[i], rain: h.precipitation_probability[i], wind: h.wind_speed_10m[i], code: h.weather_code[i] };
  }

  function weatherURL(c) {
    return D.weatherApi + "?latitude=" + c.lat + "&longitude=" + c.lon +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max" +
      "&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=auto&forecast_days=16";
  }

  async function loadWeather(code) {
    if (weather[code] || loading[code]) return;
    loading[code] = true;
    try {
      const r = await fetch(weatherURL(D.circuits[code]));
      if (!r.ok) throw new Error("HTTP " + r.status);
      weather[code] = await r.json();
    } catch (e) {
      weather[code] = { error: String(e.message || e) };
    }
    loading[code] = false;
    if (wxCode === code) renderWeather();
  }

  function renderWeather() {
    const list = Object.entries(D.circuits).sort((a, b) => {
      const o = s => (s === "next" ? 0 : s === "todo" ? 1 : 2);
      return o(a[1].state) - o(b[1].state) || a[1].round - b[1].round;
    });
    const c = D.circuits[wxCode];
    const w = weather[wxCode];
    if (c && !w) loadWeather(wxCode);

    let body = "";
    if (!c) body = `<p class="empty">Aucun circuit disponible</p>`;
    else if (!w) body = `<p class="empty">⏳ Chargement des prévisions…</p>`;
    else if (w.error || !w.daily) body = `<p class="empty">Météo indisponible pour le moment.<br><small>${esc(w.error || "")}</small></p>`;
    else {
      const d = w.daily;
      const maxRain = 100;
      const sessions = wxCode === D.nextCode && D.sessions.length
        ? `<div class="card"><div class="label">🏍️ Météo des séances (heure de Paris)</div>${
            D.sessions.map(s => {
              const m = weatherAtT(w, s.t);
              return `<div class="row ${s.kind === "race" ? "hl" : ""}">
                <span>${s.icon} ${esc(s.label)}<br><small class="muted">${esc(dayS(s.t))} · ${esc(hour(s.t))}</small></span>
                <span class="r">${m ? `<span style="font-size:20px">${wx(m.code)[0]}</span> <b style="color:#fff">${Math.round(m.temp)}°</b><br><small>💧 ${m.rain ?? 0}% · 💨 ${Math.round(m.wind)} km/h</small>` : "<small>Pas encore prévu</small>"}</span>
              </div>`;
            }).join("")}</div>`
        : "";

      body = `${sessions}
        <div class="card"><div class="label">📆 Prévisions 16 jours · ${esc(c.place || c.circuit)}</div>
        ${d.time.map((k, i) => {
          const gp = c.startKey && k >= c.startKey && k <= c.endKey;
          const [ico, lbl] = wx(d.weather_code[i]);
          const rain = d.precipitation_probability_max?.[i] ?? 0;
          return `<div class="wday ${gp ? "gp" : ""}">
            <div><b style="font-size:13px">${esc(fmtUTC(k, { weekday: "short", day: "numeric", month: "short" }))}</b>${gp ? `<br><small style="color:var(--red);font-weight:800">GP</small>` : ""}</div>
            <div class="e">${ico}</div>
            <div class="t"><b>${Math.round(d.temperature_2m_max[i])}°</b> <span>${Math.round(d.temperature_2m_min[i])}°</span><br><small class="muted">${esc(lbl)}</small>
              <div class="rainbar"><div style="width:${Math.min(maxRain, rain)}%"></div></div></div>
            <div class="x">💧 ${rain}%${d.precipitation_sum?.[i] ? "<br>" + d.precipitation_sum[i].toLocaleString(LOC) + " mm" : ""}<br>💨 ${Math.round(d.wind_speed_10m_max[i])} km/h</div>
          </div>`;
        }).join("")}
        </div>
        <div class="foot">Prévisions Open-Meteo · heure locale du circuit · la fiabilité baisse au-delà de 7 jours</div>`;
    }

    $("#weather").innerHTML = `
      <div class="scroller">${list.map(([k, x]) => `<button data-wx="${esc(k)}" class="${k === wxCode ? "on" : ""}">${x.flag} ${esc(x.gp.replace("GP ", ""))}</button>`).join("")}</div>
      ${c ? `<div class="card hero" style="padding:16px"><div class="label">🌦️ Météo circuit</div>
        <div class="gp-name" style="font-size:22px">${c.flag} ${esc(c.circuit)}</div>
        <div class="gp-meta">${esc(c.gp)} · ${esc(range(c.startKey, c.endKey))}${c.state === "done" ? " (couru)" : ""}</div></div>` : ""}
      ${body}`;
    const on = document.querySelector('.scroller button.on');
    if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  }

  // ---------------- LIVE ----------------

  function liveHTML(max) {
    if (!D.live) return `<p class="empty">Aucune séance MotoGP en cours.<br><small>Le direct s'affiche ici pendant les week-ends de course.</small></p>`;
    return `<div class="live-status">● ${esc(D.live.session)}</div>` +
      D.live.riders.slice(0, max || 99).map(r => `<div class="row"><b>${r.pos}. ${esc(r.name)}</b><span class="r">${esc(r.gap)}</span></div>`).join("");
  }

  function renderLive() {
    $("#live").innerHTML = `<div class="card"><div class="label">🔴 Classement live</div>${liveHTML()}</div>`;
  }

  // ---------------- FICHES (panneau) ----------------

  function open(type, key) {
    openSheet = { type, key };
    $("#sheetBody").innerHTML = type === "rider" ? riderSheet(key) : circuitSheet(key);
    $("#sheet").classList.add("open");
    document.body.classList.add("lock");
    $("#sheet .panel").scrollTop = 0;
  }

  function close() {
    openSheet = null;
    $("#sheet").classList.remove("open");
    document.body.classList.remove("lock");
  }

  // ---------------- NAVIGATION ----------------

  const renders = { home: renderHome, calendar: renderCalendar, ranking: renderRanking, riders: renderRiders, circuits: renderCircuits, weather: renderWeather, live: renderLive };
  let tab = "home";

  function show(id) {
    tab = id;
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === id));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
    renders[id]();
    window.scrollTo({ top: 0 });
    if (id === "calendar") {
      const n = document.getElementById("nextEvent");
      if (n) setTimeout(() => n.scrollIntoView({ behavior: "smooth", block: "center" }), 120);
    }
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab],[data-rider],[data-circuit],[data-weather],[data-wx],[data-sort],.close,.sheet .bg");
    if (!t) return;
    if (t.dataset.tab) return show(t.dataset.tab);
    if (t.classList.contains("close") || t.classList.contains("bg")) return close();
    if (t.dataset.sort) { sortMode = t.dataset.sort; return renderRiders(); }
    if (t.dataset.rider) return open("rider", t.dataset.rider);
    if (t.dataset.weather) { wxCode = t.dataset.weather; close(); return show("weather"); }
    if (t.dataset.wx) { wxCode = t.dataset.wx; return renderWeather(); }
    if (t.dataset.circuit && D.circuits[t.dataset.circuit]) return open("circuit", t.dataset.circuit);
  });

  // ---------------- PONT AVEC SCRIPTABLE ----------------

  window.MGP = {
    addRiders(obj) {
      Object.assign(riders, obj);
      if (tab === "riders") renderRiders();
      if (openSheet?.type === "rider" && obj[openSheet.key]) {
        const panel = $("#sheet .panel"), y = panel.scrollTop;
        $("#sheetBody").innerHTML = riderSheet(openSheet.key);
        panel.scrollTop = y;
      }
      return true;
    },
    ridersDone() {
      ridersDone = true;
      if (tab === "riders") renderRiders();
      return true;
    },
    addWeather(code, data) {
      if (data && !weather[code]) weather[code] = data;
      if (tab === "weather" && wxCode === code) renderWeather();
      if (tab === "home" && code === D.nextCode) renderHome();
      return true;
    }
  };

  // ---------------- COMPTE À REBOURS ----------------

  function tick() {
    if (!D.target || tab !== "home") return;
    const s = Math.floor(Math.max(0, D.target - Date.now()) / 1000);
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set("t-d", Math.floor(s / 86400)); set("t-h", pad(Math.floor((s % 86400) / 3600)));
    set("t-m", pad(Math.floor((s % 3600) / 60))); set("t-s", pad(s % 60));
  }

  renderHome();
  tick();
  setInterval(tick, 1000);
}

// Envoie les données chargées en arrière-plan vers la page
async function streamToPage(web, D) {
  const push = js => web.evaluateJavaScript(js, false);

  // 1) Météo des prochains GP (rapide)
  const upcoming = D.events.filter(e => !isFinished(e) && circuitFor(e)).slice(0, 3);
  for (const e of upcoming) {
    if (D.weather && D.next?.code === e.code) continue;
    const w = await getWeather(circuitFor(e));
    if (w) await push("window.MGP&&MGP.addWeather(" + safeJSON(e.code) + "," + safeJSON(w) + ")");
  }

  // 2) Fiches pilotes par lots de 6
  const list = D.ranking.filter(r => r.profileId || r.legacy != null);
  for (let i = 0; i < list.length; i += 6) {
    const chunk = list.slice(i, i + 6);
    const res = await Promise.all(chunk.map(fetchRider));
    const payload = {};
    chunk.forEach((r, j) => { if (res[j].profile || res[j].stats) payload[riderKey(r)] = res[j]; });
    await push("window.MGP&&MGP.addRiders(" + safeJSON(payload) + ")");
  }
  await push("window.MGP&&MGP.ridersDone()");
}

async function showDashboard(D) {
  const web = new WebView();
  await web.loadHTML(dashboardHTML(D));
  const shown = web.present(true);
  try { await streamToPage(web, D); } catch (e) { console.log("Stream : " + e); }
  await shown;
}

// ==================================================
// DÉMARRAGE
// ==================================================

const DATA = await loadData();

if (config.runsInWidget || config.runsInAccessoryWidget) {
  Script.setWidget(buildWidget(DATA, config.widgetFamily || "large"));
} else if (CFG.preview) {
  const w = buildWidget(DATA, CFG.preview);
  if (CFG.preview === "small") await w.presentSmall();
  else if (CFG.preview === "medium") await w.presentMedium();
  else await w.presentLarge();
} else {
  await showDashboard(DATA);
}

Script.complete();
